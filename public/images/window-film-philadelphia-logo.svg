<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 56" width="320" height="56">
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#2E6B30"/>
      <stop offset="100%" stop-color="#7CB342"/>
    </linearGradient>
  </defs>
  <!-- Window icon -->
  <g transform="translate(0,0)">
    <!-- Outer frame -->
    <rect x="2" y="6" width="36" height="44" rx="4" fill="none" stroke="url(#g)" stroke-width="2.5"/>
    <!-- Glass panes - 2x2 grid -->
    <line x1="20" y1="6" x2="20" y2="50" stroke="url(#g)" stroke-width="2"/>
    <line x1="2" y1="28" x2="38" y2="28" stroke="url(#g)" stroke-width="2"/>
    <!-- Film tint overlay on bottom-right pane -->
    <rect x="21" y="29" width="16" height="20" rx="2" fill="#7CB342" opacity="0.35"/>
    <!-- Sun reflection -->
    <line x1="8" y1="10" x2="16" y2="18" stroke="#7CB342" stroke-width="1.5" stroke-linecap="round" opacity="0.6"/>
  </g>
  <!-- Text -->
  <g transform="translate(46,0)">
    <!-- WINDOW FILM - Line 1 -->
    <text y="24" font-family="Arial, sans-serif" font-size="13" font-weight="700" letter-spacing="2" fill="#ffffff">WINDOW FILM</text>
    <!-- PHILADELPHIA - Line 2 -->
    <text y="44" font-family="Arial, sans-serif" font-size="10" font-weight="400" letter-spacing="3" fill="#7CB342">PHILADELPHIA</text>
  </g>
</svg>
