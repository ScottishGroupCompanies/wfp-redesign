<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 56" width="320" height="56">
  <defs>
    <linearGradient id="g1" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7CB342"/>
      <stop offset="100%" stop-color="#2E6B30"/>
    </linearGradient>
  </defs>
  <!-- Window/glass icon -->
  <g transform="translate(0,4)">
    <!-- Outer frame -->
    <rect x="1" y="0" width="40" height="46" rx="3" fill="none" stroke="url(#g1)" stroke-width="2.5"/>
    <!-- Vertical divider -->
    <line x1="21" y1="0" x2="21" y2="46" stroke="url(#g1)" stroke-width="2"/>
    <!-- Horizontal divider -->
    <line x1="1" y1="23" x2="41" y2="23" stroke="url(#g1)" stroke-width="2"/>
    <!-- Film tint on top-right pane -->
    <rect x="22" y="1" width="18" height="21" rx="1" fill="#7CB342" opacity="0.3"/>
    <!-- Sun reflection lines on top-left pane -->
    <line x1="7" y1="5" x2="17" y2="15" stroke="#7CB342" stroke-width="1.5" stroke-linecap="round" opacity="0.5"/>
    <line x1="5" y1="8" x2="10" y2="8" stroke="#7CB342" stroke-width="1" stroke-linecap="round" opacity="0.4"/>
  </g>
  <!-- Text block -->
  <g transform="translate(48,0)">
    <!-- WINDOW FILM — Line 1, white, bold -->
    <text y="23" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="700" letter-spacing="2.5" fill="#ffffff">WINDOW FILM</text>
    <!-- PHILADELPHIA — Line 2, primary green -->
    <text y="42" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="400" letter-spacing="4" fill="#7CB342">PHILADELPHIA</text>
  </g>
</svg>
