<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 260 50" width="260" height="50">
  <!-- Circular gem logo - 4 quadrants with triangular facets -->
  <g transform="translate(25,25)">
    <!-- Outer circle clip -->
    <circle cx="0" cy="0" r="22" fill="none"/>
    <clipPath id="c">
      <circle cx="0" cy="0" r="22"/>
    </clipPath>
    <g clip-path="url(#c)">
      <!-- Top-left quadrant - bright green -->
      <polygon points="-22,-22 0,-22 0,0" fill="#7CB342"/>
      <polygon points="-22,-22 0,0 -22,0" fill="#8BC34A"/>
      <!-- Top-right quadrant - medium green -->
      <polygon points="0,-22 22,-22 22,0" fill="#2E6B30"/>
      <polygon points="0,-22 22,0 0,0" fill="#4CAF50"/>
      <!-- Bottom-left quadrant - dark green -->
      <polygon points="-22,0 0,0 0,22" fill="#558B2F"/>
      <polygon points="-22,0 0,22 -22,22" fill="#2E6B30"/>
      <!-- Bottom-right quadrant - gradient green -->
      <polygon points="0,0 22,-22 22,0" fill="#33691E"/>
      <polygon points="0,0 22,0 0,22" fill="#1B5E20"/>
      <!-- Center cross dividers -->
      <line x1="-22" y1="0" x2="22" y2="0" stroke="#14201A" stroke-width="1.2"/>
      <line x1="0" y1="-22" x2="0" y2="22" stroke="#14201A" stroke-width="1.2"/>
      <!-- Diagonal facet lines for gem effect -->
      <line x1="-22" y1="-22" x2="0" y2="0" stroke="#9CCC65" stroke-width="0.6" opacity="0.5"/>
      <line x1="22" y1="-22" x2="0" y2="0" stroke="#A5D6A7" stroke-width="0.6" opacity="0.5"/>
      <line x1="22" y1="22" x2="0" y2="0" stroke="#66BB6A" stroke-width="0.6" opacity="0.4"/>
      <line x1="-22" y1="22" x2="0" y2="0" stroke="#81C784" stroke-width="0.6" opacity="0.4"/>
    </g>
    <!-- Outer ring -->
    <circle cx="0" cy="0" r="22" fill="none" stroke="#7CB342" stroke-width="1.5"/>
  </g>
  <!-- Text -->
  <g transform="translate(56,0)">
    <!-- WINDOW FILM — Line 1, off-white -->
    <text y="20" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="700" letter-spacing="2" fill="#F3F6F1">WINDOW FILM</text>
    <!-- PHILADELPHIA — Line 2, primary green -->
    <text y="37" font-family="Arial, Helvetica, sans-serif" font-size="10" font-weight="400" letter-spacing="3.5" fill="#7CB342">PHILADELPHIA</text>
  </g>
</svg>
